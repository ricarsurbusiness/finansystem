services:
  postgres:
    image: postgres:16-alpine
    container_name: finansystem-db

    environment:
      POSTGRES_USER: finansystem
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finansystem_dev}
      POSTGRES_DB: finansystem

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finansystem"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - finansystem-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: finansystem-backend

    ports:
      - "8081:8081"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: finansystem
      DB_PASSWORD: ${DB_PASSWORD:-finansystem_dev}
      DB_NAME: finansystem
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - finansystem-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api

    container_name: finansystem-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: /api

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - finansystem-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"


    volumes:
      - uptime-kuma:/app/data

    networks:
      - finansystem-network
  prometheus:
    image: prom/prometheus
    container_name: prometheus

    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - finansystem-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SERVER_ROOT_URL=http://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - finansystem-network
  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter

    restart: unless-stopped

    ports:
      - "127.0.0.1:9100:9100"

    networks:
      - finansystem-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor

    restart: unless-stopped

    privileged: true

    ports:
      - "127.0.0.1:8088:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    networks:
      - finansystem-network
  loki:
    image: grafana/loki:latest
    container_name: loki

    restart: unless-stopped

    ports:
      - "127.0.0.1:3100:3100"

    command: -config.file=/etc/loki/local-config.yaml

    networks:
      - finansystem-network
  promtail:
    image: grafana/promtail:latest
    container_name: promtail

    restart: unless-stopped

    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml

    command: -config.file=/etc/promtail/config.yml

    networks:
      - finansystem-network
networks:
  finansystem-network:
    driver: bridge

volumes:
  postgres_data:
  uptime-kuma:
  grafana_data:
