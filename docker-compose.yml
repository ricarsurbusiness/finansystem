services:
  postgres:
    image: postgres:16-alpine
    container_name: finansystem-db
    environment:
      POSTGRES_USER: finansystem
      POSTGRES_PASSWORD: finansystem_dev
      POSTGRES_DB: finansystem
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finansystem"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: